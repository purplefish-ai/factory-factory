publicHoistPattern:
  - '@types/*'

# Preserve pnpm 10's release-age policy, including same-day security updates.
minimumReleaseAge: 0

allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  electron: true
  esbuild: true
  node-pty: true
  prisma: true
  protobufjs: true
  sharp: true
  electron-winstaller: false

packageExtensions:
  'electron-builder@26.17.0':
    dependencies:
      electron-builder-squirrel-windows: 26.17.0

overrides:
  # Prisma 7 still pins versions affected by GHSA-ggr8-5vv4-36mx and MySQL2 advisories.
  '@prisma/config>deepmerge-ts': 8.0.2
  'prisma>mysql2': 3.24.5
  '@isaacs/brace-expansion': '>=5.0.1'
  '@modelcontextprotocol/sdk>ajv': '>=8.18.0'
  '@anthropic-ai/sdk': 0.124.0
  '@babel/core': 7.29.7
  '@hono/node-server': 2.1.3
  '@xmldom/xmldom': 0.8.15
  'app-builder-lib>minimatch': '>=10.2.1'
  axios: 1.20.0
  body-parser: 2.3.0
  fast-uri: 3.1.8
  brace-expansion: 5.0.12
  braces: '>=3.0.3'
  'filelist>minimatch': '>=10.2.1'
  follow-redirects: 1.16.1
  micromatch: '>=4.0.8'
  postcss: 8.5.28
  tar: 7.5.22
  hono: 4.13.12
  ip-address: 10.7.2
  lodash: 4.18.1
  lodash-es: 4.18.1
  next: 16.3.8
  path-to-regexp: 8.4.2
  'picomatch@^2': 2.3.2
  'picomatch@^4': 4.0.7
  serialize-javascript: 7.1.2
  smol-toml: 1.9.0
  dompurify: 3.4.16
  esbuild: 0.28.2
  electron-builder-squirrel-windows: 26.17.0
  find-my-way: 9.9.0
  qs: 6.16.0
  sharp: 0.35.5
  tmp: 0.2.7
  form-data: 4.0.6
  js-yaml: 4.3.2
  shell-quote: 1.11.0
  undici: 7.29.1
  tough-cookie: '>=4.1.3'
  uuid: 14.0.2
  valibot: 1.5.0
  webpack: 5.111.1
  yaml: 2.9.1

  # Mermaid 12 still requests the older vulnerable KaTeX line.
  katex: 0.18.2
