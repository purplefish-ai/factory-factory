# GitHub currently reads only the first document of pnpm 12 lockfiles.
# Keep project dependencies visible; .pnpmfile.mjs enforces packageManager instead.
# https://github.com/dependabot/dependabot-core/issues/15904
pmOnFail: ignore

publicHoistPattern:
  - '@types/*'

# Review new releases for three days; urgent fixes need an exact-version exception.
# See docs/dependency-security.md for review and exception requirements.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Existing releases reviewed against registry metadata, lock integrity and upstream
# releases; dependency maintainers re-review by 2026-12-05 (see security docs).
trustPolicyExclude:
  - prisma@7.10.1
  - semver@6.3.1

allowBuilds:
  '@prisma/engines@7.10.1': true
  esbuild@0.28.2: true
  node-pty@1.1.0: true
  prisma@7.10.1: true

overrides:
  # Prisma 7 still pins versions affected by GHSA-ggr8-5vv4-36mx and MySQL2 advisories.
  '@prisma/config>deepmerge-ts': 8.0.2
  # Prisma 7 pins Effect 3.20.0, which is affected by GHSA-7589-6fvf-x4pw.
  '@prisma/config>effect': 3.22.1
  # Prisma 7's adapter requests better-sqlite3 v12. Keep it on the app's driver:
  # two SQLite builds in one process release each other's POSIX locks on the
  # database file, and v12 needs an install-time native build allowBuilds denies.
  '@prisma/adapter-better-sqlite3>better-sqlite3': 13.2.0
  'prisma>mysql2': 3.24.6
  '@isaacs/brace-expansion': '>=5.0.1'
  '@modelcontextprotocol/sdk>ajv': '>=8.18.0'
  '@anthropic-ai/sdk': 1.3.0
  # Storybook's react-docgen still requires Babel 7's APIs and companion packages.
  '@babel/core': 7.29.7
  '@hono/node-server': 2.1.6
  body-parser: 2.4.0
  fast-uri: 4.2.3
  brace-expansion: 5.0.12
  braces: '>=3.0.3'
  micromatch: '>=4.0.8'
  postcss: 8.5.32
  hono: 4.13.16
  ip-address: 10.7.5
  lodash: 4.18.1
  lodash-es: 4.18.1
  next: 16.4.3
  path-to-regexp: 9.0.0
  # tsc-alias's glob/watch consumers still request Picomatch 2.
  'picomatch@^2': 2.3.2
  'picomatch@^4': 4.0.7
  serialize-javascript: 7.1.4
  smol-toml: 1.9.1
  dompurify: 3.4.17
  esbuild: 0.28.2
  find-my-way: 9.10.0
  qs: 6.17.1
  sharp: 0.35.5
  form-data: 4.0.6
  # Keep each consumer on its supported, patched major: Slack 7 and jsdom 8.
  # A global pin would force incompatible APIs across those tools.
  'undici@^7': 7.30.1
  'undici@^8': 8.12.3
  tough-cookie: '>=4.1.3'
  uuid: 14.0.3
  valibot: 1.5.0
  webpack: 5.112.2
  yaml: 2.9.1

  # Security fixes pending upstream dependency range updates.
  minimatch: 11.0.3
  glob: 14.0.2
  # Mermaid 12 still requests the older vulnerable KaTeX line.
  katex: 0.19.1
  source-map-js: 1.2.2
  proxy-addr: 2.0.8
  postcss-selector-parser: 7.1.7
  '@modelcontextprotocol/sdk': 1.32.2

# Remove these local mitigations once upstream publishes fixed releases.
patchedDependencies:
  # Keep selector-error snapshots stable; remove after the upstream timestamp fix.
  '@tanstack/query-core@5.106.0': patches/@tanstack__query-core@5.106.0.patch
  braces@3.0.3: patches/braces@3.0.3.patch
