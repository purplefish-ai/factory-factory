publicHoistPattern:
  - '@types/*'

# Preserve pnpm 10's release-age policy, including same-day security updates.
minimumReleaseAge: 0

allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  electron: true
  esbuild: true
  node-pty: true
  prisma: true
  protobufjs: true
  sharp: true
  electron-winstaller: false

packageExtensions:
  'electron-builder@26.16.1':
    dependencies:
      electron-builder-squirrel-windows: 26.16.1

overrides:
  # Refresh Claude SDK permission fixes; remove when ACP advances its exact pin.
  '@agentclientprotocol/claude-agent-acp>@anthropic-ai/claude-agent-sdk': 0.3.266
  # Prisma 7 still pins versions affected by GHSA-ggr8-5vv4-36mx and MySQL2 advisories.
  '@prisma/config>deepmerge-ts': 8.0.2
  'prisma>mysql2': 3.24.4
  '@isaacs/brace-expansion': '>=5.0.1'
  '@modelcontextprotocol/sdk>ajv': '>=8.18.0'
  '@anthropic-ai/sdk': 0.124.0
  '@babel/core': 7.29.7
  '@hono/node-server': 2.1.1
  '@xmldom/xmldom': 0.8.15
  'app-builder-lib>minimatch': '>=10.2.1'
  axios: 1.20.0
  body-parser: 2.3.0
  fast-uri: 3.1.7
  brace-expansion: 5.0.9
  braces: '>=3.0.3'
  'filelist>minimatch': '>=10.2.1'
  follow-redirects: 1.16.0
  micromatch: '>=4.0.8'
  postcss: 8.5.28
  tar: 7.5.22
  hono: 4.13.7
  ip-address: 10.7.0
  lodash: 4.18.1
  lodash-es: 4.18.1
  next: 16.3.4
  path-to-regexp: 8.4.2
  'picomatch@^2': 2.3.2
  'picomatch@^4': 4.0.7
  serialize-javascript: 7.1.1
  smol-toml: 1.8.0
  dompurify: 3.4.15
  esbuild: 0.28.2
  electron-builder-squirrel-windows: 26.16.1
  find-my-way: 9.9.0
  qs: 6.16.0
  sharp: 0.35.4
  tmp: 0.2.7
  form-data: 4.0.6
  js-yaml: 4.3.2
  shell-quote: 1.10.0
  undici: 7.29.1
  tough-cookie: '>=4.1.3'
  uuid: 14.0.2
  valibot: 1.4.2
  webpack: 5.110.3
  yaml: 2.9.0
