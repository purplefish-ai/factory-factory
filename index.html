<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Factory Factory - Workspace-based coding environment" />
    <title>Factory Factory</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Factory Factory" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Inter:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Atkinson+Hyperlegible+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-geist-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
        --font-geist-mono: 'Geist Mono', 'IBM Plex Mono', ui-monospace, monospace;
        --font-inter: 'Inter', ui-sans-serif, system-ui, sans-serif;
        --font-plex-mono: 'IBM Plex Mono', ui-monospace, monospace;
      }
    </style>
    <script>
      // Replay the last applied appearance (Settings → Appearance) before React
      // mounts so a reload doesn't flash the default font size and colors.
      // Written by src/client/lib/appearance.ts; keep the key in sync.
      (function () {
        try {
          var raw = localStorage.getItem('factoryfactory_appearance');
          if (!raw) return;
          var saved = JSON.parse(raw);
          var root = document.documentElement;
          if (typeof saved.colorScheme === 'string') {
            root.setAttribute('data-color-scheme', saved.colorScheme);
          }
          var styles = saved.styles;
          if (styles && typeof styles === 'object') {
            for (var property in styles) {
              if (typeof styles[property] === 'string') {
                root.style.setProperty(property, styles[property]);
              }
            }
          }
        } catch (_error) {
          // Ignore: preferences load from the server once the app mounts.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
