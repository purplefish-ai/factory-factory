name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  checks:
    name: Lint, Type Check, Dependencies & Dead Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check generated Prisma client is committed
        run: pnpm check:prisma-generated

      - name: Check Prisma migrations are committed
        run: |
          pnpm exec prisma migrate diff \
            --from-schema prisma/schema.prisma \
            --to-migrations prisma/migrations \
            --exit-code

      - name: Run verification checks
        run: pnpm check

      - name: Check ambiguous relative imports
        run: pnpm check:imports

      - name: Enforce inline lint suppression policy
        run: pnpm check:lint-suppressions

      - name: Run Knip (unused files & dependencies)
        run: pnpm knip --include files,dependencies,unlisted

      - name: Run TypeScript check
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build Storybook
        run: pnpm build:storybook

  test-shards:
    name: Test shard (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Resolve native module ABI and OS version
        id: native-abi
        run: |
          echo "version=$(node -p 'process.versions.modules')" >> "$GITHUB_OUTPUT"
          . /etc/os-release
          echo "distribution=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Cache Node native modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Do not cache .current-target: a fresh install still needs the cached
          # binaries copied into node_modules by ensure-native-modules.mjs.
          path: .native-cache/node-abi${{ steps.native-abi.outputs.version }}/
          key: ff-native-v1-${{ runner.os }}-${{ steps.native-abi.outputs.distribution }}-${{ runner.arch }}-node-abi${{ steps.native-abi.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/ensure-native-modules.mjs') }}

      - name: Run tests with coverage
        run: pnpm test --config vitest.shard.config.ts --coverage --reporter=default --reporter=blob --shard=${{ matrix.shard }}/2

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-results-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test
    needs: test-shards
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - name: Require every test shard to pass
        if: always() && needs.test-shards.result != 'success'
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download test and coverage results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-results-*
          path: .vitest/blob/
          merge-multiple: true

      - name: Require both shard reports
        run: test -f .vitest/blob/blob-1-2.json && test -f .vitest/blob/blob-2-2.json

      - name: Merge coverage and enforce thresholds
        run: pnpm exec vitest run --merge-reports=.vitest/blob --coverage && pnpm check:coverage:critical

      - name: Report Coverage
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
