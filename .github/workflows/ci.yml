name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

# Supersede older revisions of each PR only. Every other run (push to main, merge
# queue) has its own group and is never cancelled, so each commit on main gets a
# verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select CI jobs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.select.outputs.app }}
      storybook: ${{ steps.select.outputs.storybook }}
      sandbox: ${{ steps.select.outputs.sandbox }}
      timings: ${{ steps.timings.outputs.cache-matched-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Select jobs from integrated changes
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: node .github/scripts/select-ci.mjs "$EVENT" >> "$GITHUB_OUTPUT"

      - name: Select one immutable test duration snapshot
        id: timings
        if: steps.select.outputs.app == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vitest/timings-history.json
          key: ff-test-timings-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ff-test-timings-v1-
          lookup-only: true

  checks:
    name: Lint, Type Check, Dependencies & Dead Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      # Two levels give the pull request merge commit's parents, so
      # `check:guidance` can compare legacy note ceilings with the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check generated Prisma client is committed
        run: pnpm check:prisma-generated

      # The same command contributors run locally: lint (including the inline
      # suppression policy), format, file lengths, environment access, relative
      # imports, ownership, FK indexes, migration drift, dependencies, Knip and
      # unused code. Add new local checks to the package script, not here.
      - name: Run verification checks
        run: pnpm check

      - name: Run TypeScript check
        run: pnpm typecheck

  build:
    name: Build work
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Pack consumer artifact
        run: npm pack --silent
        env:
          HUSKY: '0'

      - name: Upload consumer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-runtime-package
          path: factory-factory-*.tgz
          if-no-files-found: error
          retention-days: 1

  # The packed check installs the tarball as a consumer, serves it and drives a
  # workspace turn with the scripted fake Codex. Ubuntu runs every supported
  # floor. macOS, where most users run the package, runs one leg because its
  # runners are slower and scarcer: the oldest floor, where support broke last.
  # The release workflow runs every Node version on macOS before publishing.
  minimum-node:
    name: Minimum Node runtime (${{ matrix.node-version }}${{ matrix.os == 'macos-latest' && ', macOS' || '' }})
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['24.0.0', '26.8.1']
        include:
          - os: macos-latest
            node-version: '24.0.0'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download consumer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-runtime-package
          path: npm-package

      - name: Setup consumer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Launch the packed CLI
        run: bash scripts/check-packed-consumer.sh cold

  storybook:
    name: Storybook Build work
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build Storybook
        run: pnpm build:storybook

  storybook-tests:
    name: Storybook Tests work
    needs: changes
    if: needs.changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    # Official image includes matching browsers, OS libraries and browser fonts.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_IMAGE_VERSION: '1.64.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      # Keep the store on the workspace mount. The container HOME is a separate
      # filesystem, so pnpm otherwise ignores its restored store for hardlinks.
      - name: Cache Storybook dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /__w/.pnpm-store/v11
          key: ff-storybook-pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser-test dependencies
        # Browser stories do not use node-pty or SQLite. The official
        # browser image has no native compiler; rebuild only browser prerequisites.
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --store-dir /__w/.pnpm-store
          pnpm rebuild @prisma/engines esbuild

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify Playwright environment matches installed packages
        run: |
          node --input-type=module -e '
            import { createRequire } from "node:module";
            const root = createRequire(import.meta.url);
            const provider = createRequire(root.resolve("@vitest/browser-playwright"));
            const browser = createRequire(provider.resolve("playwright/package.json"));
            const versions = {
              "@playwright/test": root("@playwright/test/package.json").version,
              playwright: provider("playwright/package.json").version,
              "playwright-core": browser("playwright-core/package.json").version,
            };
            for (const [name, version] of Object.entries(versions)) {
              if (version !== process.env.PLAYWRIGHT_IMAGE_VERSION) {
                throw new Error(`${name} ${version} does not match the pinned Playwright image; update image tag, digest and version together`);
              }
            }
            // Use the actual Vitest provider dependency, including its image binary.
            const chromium = await provider("playwright").chromium.launch();
            console.log(`Image Chromium: ${chromium.version()}`);
            await chromium.close();
          '

      # Renders every story in headless Chromium and runs its play function.
      - name: Test stories
        run: pnpm test:storybook

  # The browser-driven sandbox specs, split by Playwright project
  # (playwright.sandbox.config.ts): `restart` runs the restart and crash specs,
  # `general` every other spec, a new file included. Each shard starts its own
  # sandbox. `Smoke` joins them. Nothing else waits for them.
  smoke-shards:
    name: Smoke shard (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [general, restart]
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser download is cached; the install below then only adds the
      # operating system packages, which live outside the cache.
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ff-playwright-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # Starts the shard's sandbox, runs its specs and stops it.
      - name: Run sandbox specs
        run: pnpm test:e2e:sandbox --project=${{ matrix.shard }}

      - name: Upload trace, screenshot and sandbox logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-smoke-evidence-${{ matrix.shard }}
          path: |
            test-results/sandbox/
            test-results/sandbox-logs/
          if-no-files-found: warn
          retention-days: 7

  test-shards:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Test shard (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Restore shared test duration snapshot
        id: shard-timings
        if: needs.changes.outputs.timings != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vitest/timings-history.json
          # Both shards MUST restore this exact key, not independently look up
          # latest history: different snapshots could duplicate or omit tests.
          key: ${{ needs.changes.outputs.timings }}
          fail-on-cache-miss: true

      - name: Require exact test duration snapshot
        if: needs.changes.outputs.timings != '' && steps.shard-timings.outputs.cache-matched-key != needs.changes.outputs.timings
        run: exit 1

      - name: Run tests with coverage
        run: pnpm test --config vitest.shard.config.ts --coverage --shard=${{ matrix.shard }}/2

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-results-${{ matrix.shard }}
          path: |
            .vitest/blob/
            .vitest/results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test coverage
    needs: [changes, test-shards]
    if: ${{ !cancelled() && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - name: Require every test shard to pass
        if: always() && needs.test-shards.result != 'success'
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'

      - name: Locate coverage toolchain store
        id: merge-store
        run: echo "path=$(pnpm --dir .github/coverage-merge store path)" >> "$GITHUB_OUTPUT"

      - name: Cache coverage toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.merge-store.outputs.path }}
          # A separate namespace prevents cold runs restoring the much larger
          # application cache through setup-node's generic pnpm restore key.
          key: ff-coverage-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/coverage-merge/pnpm-lock.yaml', '.github/coverage-merge/package.json', '.node-version') }}

      - name: Install coverage toolchain
        run: pnpm --dir .github/coverage-merge install --frozen-lockfile

      - name: Download test and coverage results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-results-*
          path: .vitest/
          merge-multiple: true

      - name: Require both shard reports
        run: test -f .vitest/blob/blob-1-2.json && test -f .vitest/blob/blob-2-2.json

      - name: Require complete and unique test results
        run: node .github/coverage-merge/validate-reports.mjs

      - name: Merge coverage and enforce thresholds
        run: node .github/coverage-merge/node_modules/vitest/vitest.mjs run --config .github/coverage-merge/vitest.config.ts --merge-reports=.vitest/blob --coverage && node scripts/check-critical-coverage.mjs

      - name: Save measured test durations
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vitest/timings-history.json
          key: ff-test-timings-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report Coverage
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@74c2d9210b4fc44c84d8213f61d7ec99837b7aa0 # v2.13.2
  require-build:
    name: Build
    if: always()
    needs: [changes, build, minimum-node]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful work or an explicit irrelevant-change decision
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.app }}
          WORK_RESULT: ${{ needs.build.result }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Unexpected CI result: selected=$SELECTED result=$WORK_RESULT"; exit 1 ;;
          esac

      - name: Require minimum runtime compatibility
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.app }}
          WORK_RESULT: ${{ needs.minimum-node.result }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Unexpected CI result: selected=$SELECTED result=$WORK_RESULT"; exit 1 ;;
          esac

  require-storybook:
    name: Storybook Build
    if: always()
    needs: [changes, storybook]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful work or an explicit irrelevant-change decision
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.storybook }}
          WORK_RESULT: ${{ needs.storybook.result }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Unexpected CI result: selected=$SELECTED result=$WORK_RESULT"; exit 1 ;;
          esac

  require-storybook-tests:
    name: Storybook Tests
    if: always()
    needs: [changes, storybook-tests]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful work or an explicit irrelevant-change decision
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.storybook }}
          WORK_RESULT: ${{ needs.storybook-tests.result }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Unexpected CI result: selected=$SELECTED result=$WORK_RESULT"; exit 1 ;;
          esac

  require-test:
    name: Test
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful work or an explicit irrelevant-change decision
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.app }}
          WORK_RESULT: ${{ needs.test.result }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Unexpected CI result: selected=$SELECTED result=$WORK_RESULT"; exit 1 ;;
          esac

  # Not yet a required check. The bar for requiring it: 20 consecutive
  # completed runs of `Smoke` on main, counted from the merge that added this
  # job. Runs dispatched by hand on the head of main count; cancelled runs count
  # neither way.
  require-smoke:
    name: Smoke
    if: always()
    needs: [changes, smoke-shards]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful work or an explicit irrelevant-change decision
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.sandbox }}
          WORK_RESULT: ${{ needs.smoke-shards.result }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$SELECTED:$WORK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Unexpected CI result: selected=$SELECTED result=$WORK_RESULT"; exit 1 ;;
          esac
