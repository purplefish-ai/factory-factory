name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually publish)"
        required: false
        default: 'false'
        type: boolean

jobs:
  verify:
    name: Build release tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release source
        # Credential-free dry runs may validate a feature branch without staging.
        if: ${{ github.event_name == 'release' || github.event.inputs.dry_run != 'true' }}
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" FETCH_HEAD; then
            echo "Release commit must belong to main" >&2
            exit 1
          fi
          if [ "$RELEASE_EVENT" = "release" ]; then
            VERSION=$(jq -er '.version | select(type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' package.json)
            test "$RELEASE_REF" = "refs/tags/v$VERSION"
          else
            test "$RELEASE_REF" = "refs/heads/main"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Install npm CLI
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify Prisma versions are pinned
        run: node scripts/check-prisma-versions.mjs

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack npm tarball
        run: npm pack --silent

      - name: Verify packed artifact contains no development files
        run: node scripts/check-production-artifact.mjs --tarball factory-factory-*.tgz

      - name: Publish to npm (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        # Feature branches can exercise the current tarball after its version ships.
        env:
          npm_config_force: ${{ github.ref != 'refs/heads/main' }}
        run: npm publish --dry-run ./factory-factory-*.tgz

      - name: Upload npm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.inputs.dry_run == 'true' && 'dry-run-package' || 'npm-package' }}
          path: factory-factory-*.tgz
          if-no-files-found: error
          retention-days: 7

  consumer:
    name: Packed CLI (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: verify
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['24.0.0', '24.x', '26.8.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event.inputs.dry_run == 'true' && 'dry-run-package' || 'npm-package' }}
          path: npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Launch with bundled npm
        run: bash scripts/check-packed-consumer.sh cold
      - name: Switch the existing installation to the development runtime
        if: matrix.node-version == '24.0.0'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Relaunch from the same npx cache
        if: matrix.node-version == '24.0.0'
        run: bash scripts/check-packed-consumer.sh upgrade
      - name: Recover a broken cached SQLite binding
        if: matrix.os != 'windows-latest' && matrix.node-version == '24.0.0'
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/factory-factory-consumer"
          archive=("$PWD"/npm-package/factory-factory-*.tgz)
          node scripts/check-packed-recovery.mjs "$consumer/npm-cache" \
            "$(cat "$consumer/installed-package.txt")" "${archive[0]}" "$consumer" "$consumer/data/test.db"
          bash scripts/check-packed-consumer.sh cold

      - name: Verify scoped Windows recovery
        if: matrix.os == 'windows-latest' && matrix.node-version == '24.0.0'
        run: |
          node scripts/check-packed-windows-recovery.mjs
          bash scripts/check-packed-consumer.sh cold

  stage:
    name: Stage package on npm
    needs: [verify, consumer]
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-package

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false

      - name: Install npm CLI
        run: npm install --global npm@11.19.0

      - name: Stage package on npm
        # The ./ prefix prevents npm from treating the path as GitHub owner/repo shorthand.
        run: npm stage publish ./npm-package/factory-factory-*.tgz --access public

      - name: Record what happens after approval
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "After the staged package is approved on npm, the Tag npm releases workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "tags commit $GITHUB_SHA and creates the GitHub Release on its next run." >> "$GITHUB_STEP_SUMMARY"
