name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually publish)"
        required: false
        default: 'false'
        type: boolean
      finalize_release:
        description: 'Finalize after approving the staged package on npm'
        required: false
        default: 'false'
        type: boolean
      staging_run_id:
        description: 'Run ID that staged the approved npm package'
        required: false
        default: ''
        type: string

jobs:
  verify:
    name: Verify package (Node ${{ matrix.node-version }})
    if: ${{ github.event_name == 'release' || github.event.inputs.finalize_release != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['26.12.1']
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release source
        # Credential-free dry runs may validate a feature branch without staging.
        if: ${{ github.event_name == 'release' || github.event.inputs.dry_run != 'true' }}
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" FETCH_HEAD; then
            echo "Release commit must belong to main" >&2
            exit 1
          fi
          if [ "$RELEASE_EVENT" = "release" ]; then
            VERSION=$(jq -er '.version | select(type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' package.json)
            test "$RELEASE_REF" = "refs/tags/v$VERSION"
          else
            test "$RELEASE_REF" = "refs/heads/main"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install npm CLI
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify Prisma versions are pinned
        run: node scripts/check-prisma-versions.mjs

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack npm tarball
        run: npm pack --silent

      - name: Smoke test packed artifact with npm exec
        run: |
          set -euo pipefail
          ROOT_DIR="$PWD"
          TARBALL=$(ls factory-factory-*.tgz | head -n1)
          INSTALL_DIRECTORY=$(mktemp -d)
          cd "$INSTALL_DIRECTORY"
          # Consumer compatibility: isolate npm exec from previous installation caches.
          npm exec --cache "$INSTALL_DIRECTORY/npm-cache" --yes --package "$ROOT_DIR/$TARBALL" -- factory-factory serve --help
          npm exec --cache "$INSTALL_DIRECTORY/npm-cache" --yes --package "$ROOT_DIR/$TARBALL" -- factory-factory db:migrate --database-path "$INSTALL_DIRECTORY/test.db"
          npm exec --cache "$INSTALL_DIRECTORY/npm-cache" --yes --package "$ROOT_DIR/$TARBALL" -- sh -c 'node "$1" "$(dirname "$(readlink -f "$(command -v factory-factory)")")/../../.."' -- "$ROOT_DIR/scripts/check-installed-native-runtime.mjs"

      - name: Publish to npm (dry run)
        if: ${{ matrix.node-version == '26.12.1' && github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: npm publish --dry-run

      - name: Upload npm package
        if: ${{ matrix.node-version == '26.12.1' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && github.event.inputs.finalize_release != 'true')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: factory-factory-*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage package on npm
    needs: verify
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && github.event.inputs.finalize_release != 'true') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-package

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false

      - name: Install npm CLI
        run: npm install --global npm@11.19.0

      - name: Stage package on npm
        # The ./ prefix prevents npm from treating the path as GitHub owner/repo shorthand.
        run: npm stage publish ./npm-package/factory-factory-*.tgz --access public

      - name: Record finalization details
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "After npm approval, finalize this package with:" >> "$GITHUB_STEP_SUMMARY"
          echo "staging_run_id: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "staged commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  finalize-release:
    name: Finalize GitHub release
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && github.event.inputs.finalize_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve staged commit
        id: staging_run
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ github.event.inputs.staging_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "staging_run_id must be a GitHub Actions run ID" >&2
            exit 1
          fi
          RUN_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/$STAGING_RUN_ID")
          WORKFLOW_PATH=$(jq -r '.path' <<< "$RUN_JSON")
          EVENT=$(jq -r '.event' <<< "$RUN_JSON")
          HEAD_BRANCH=$(jq -r '.head_branch' <<< "$RUN_JSON")
          CONCLUSION=$(jq -r '.conclusion' <<< "$RUN_JSON")
          COMMIT=$(jq -r '.head_sha' <<< "$RUN_JSON")
          if [ "$WORKFLOW_PATH" != ".github/workflows/npm-publish.yml" ] ||
            [ "$EVENT" != "workflow_dispatch" ] ||
            [ "$HEAD_BRANCH" != "main" ] ||
            [ "$CONCLUSION" != "success" ] ||
            [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Run $STAGING_RUN_ID is not a successful main-branch staging run" >&2
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout staged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.staging_run.outputs.commit }}
          fetch-depth: 0

      - name: Verify staged commit remains on main
        env:
          STAGED_COMMIT: ${{ steps.staging_run.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$STAGED_COMMIT" FETCH_HEAD

      - name: Download staged npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-package
          github-token: ${{ github.token }}
          run-id: ${{ github.event.inputs.staging_run_id }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false

      - name: Verify package is published on npm
        id: release_version
        env:
          STAGED_COMMIT: ${{ steps.staging_run.outputs.commit }}
          STAGING_RUN_ID: ${{ github.event.inputs.staging_run_id }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(bash scripts/verify-npm-release.sh npm-package "$STAGED_COMMIT" "$STAGING_RUN_ID" "$RELEASE_REPOSITORY")
          CHECKOUT_VERSION=$(jq -er '.version' package.json)
          test "$VERSION" = "$CHECKOUT_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          STAGED_COMMIT: ${{ steps.staging_run.outputs.commit }}
        run: |
          VERSION="${{ steps.release_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            git fetch --no-tags origin "refs/tags/v$VERSION"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$STAGED_COMMIT" || {
              echo "Existing tag does not match the staged commit" >&2
              exit 1
            }
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          name: v${{ steps.release_version.outputs.version }}
          generate_release_notes: true
