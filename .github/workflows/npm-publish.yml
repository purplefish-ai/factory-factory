name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually publish)"
        required: false
        default: "false"
        type: boolean
      finalize_release:
        description: "Finalize after approving the staged package on npm"
        required: false
        default: "false"
        type: boolean

jobs:
  verify:
    name: Verify package (Node ${{ matrix.node-version }})
    if: ${{ github.event_name == 'release' || github.event.inputs.finalize_release != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22", "24"]
    permissions:
      contents: read
    env:
      DATABASE_URL: "file:./test.db"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install npm CLI
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify Prisma versions are pinned
        run: node scripts/check-prisma-versions.mjs

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack npm tarball
        run: npm pack --silent

      - name: Smoke test packed artifact with npm exec
        run: |
          set -euo pipefail
          ROOT_DIR="$PWD"
          TARBALL=$(ls factory-factory-*.tgz | head -n1)
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          npm exec --yes --package "$ROOT_DIR/$TARBALL" -- factory-factory serve --help
          npm exec --yes --package "$ROOT_DIR/$TARBALL" -- factory-factory db:migrate --database-path "$TMPDIR/test.db"

      - name: Publish to npm (dry run)
        if: ${{ matrix.node-version == '22.22' && github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: npm publish --dry-run

      - name: Upload npm package
        if: ${{ matrix.node-version == '22.22' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && github.event.inputs.finalize_release != 'true')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package
          path: factory-factory-*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage package on npm
    needs: verify
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && github.event.inputs.finalize_release != 'true') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download npm package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package
          path: npm-package

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22.22"
          package-manager-cache: false

      - name: Install npm CLI
        run: npm install --global npm@11.19.0

      - name: Stage package on npm
        run: npm stage publish npm-package/factory-factory-*.tgz --access public

  finalize-release:
    name: Finalize GitHub release
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true' && github.event.inputs.finalize_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22.22"
          package-manager-cache: false

      - name: Verify package is published on npm
        id: release_version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "factory-factory@$VERSION" version)
          if [ "$PUBLISHED_VERSION" != "$VERSION" ]; then
            echo "factory-factory@$VERSION is not published on npm" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.release_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "Tag v$VERSION already exists on remote, skipping tag creation"
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          name: v${{ steps.release_version.outputs.version }}
          generate_release_notes: true
