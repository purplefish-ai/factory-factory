name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually publish)"
        required: false
        default: "false"
        type: boolean

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22", "24"]
    permissions:
      contents: write
      id-token: write
    env:
      DATABASE_URL: "file:./test.db"
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify Prisma versions are pinned
        run: node scripts/check-prisma-versions.mjs

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack npm tarball
        run: npm pack --silent

      - name: Smoke test packed artifact with npm exec
        run: |
          set -euo pipefail
          ROOT_DIR="$PWD"
          TARBALL=$(ls factory-factory-*.tgz | head -n1)
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          npm exec --yes --package "$ROOT_DIR/$TARBALL" -- factory-factory serve --help
          npm exec --yes --package "$ROOT_DIR/$TARBALL" -- factory-factory db:migrate --database-path "$TMPDIR/test.db"

      - name: Publish to npm (dry run)
        if: ${{ matrix.node-version == '22.22' && github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ matrix.node-version == '22.22' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')) }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Compute release version
        if: ${{ matrix.node-version == '22.22' && github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true' }}
        id: release_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: ${{ matrix.node-version == '22.22' && github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true' }}
        run: |
          VERSION="${{ steps.release_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "Tag v$VERSION already exists on remote, skipping tag creation"
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Create GitHub release
        if: ${{ matrix.node-version == '22.22' && github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          name: v${{ steps.release_version.outputs.version }}
          generate_release_notes: true
