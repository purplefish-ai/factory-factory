name: Tag npm releases

# Publishing stages a package that a maintainer approves on npm, outside GitHub,
# so the publish workflow cannot tag it. This finds every published version
# newer than BACKLOG_CUTOFF (0.5.14) without a `v<version>` tag and, once its
# npm provenance, commit and tarball check out, creates the tag and the GitHub
# Release. Versions up to the cutoff are the backlog: a scheduled run only
# lists them, and a maintainer decides by running this with `backlog` set. See
# scripts/tag-npm-releases.ts.
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      backlog:
        description: 'Versions up to 0.5.14: none lists them; tags creates only the missing tags (no notifications); releases creates a Release for every one without, including old versions that already have tags'
        required: false
        default: none
        type: choice
        options:
          - none
          - tags
          - releases
      dry_run:
        description: 'Print what would be tagged and released, and create nothing'
        required: false
        default: false
        type: boolean

# A scheduled run and a manual run never create the same release twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and release published versions
    # Forks with schedules enabled skip this rather than fail every six hours.
    if: ${{ github.repository == 'purplefish-ai/factory-factory' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Creating a release creates its tag. Releases created with the workflow
    # token start no other workflow, so `release` listeners such as npm
    # publishing do not run for them.
    permissions:
      contents: write
    steps:
      # Full history: each version's commit must be reachable from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      # The script needs only tsx and zod. Skipping install scripts runs no
      # dependency code in a job that can write to the repository, and skips
      # Prisma generation and native builds it does not use.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Tag and release untagged npm versions
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          BACKLOG: ${{ inputs.backlog }}
        run: |
          set -euo pipefail
          # A scheduled run has no inputs, so it leaves the backlog alone.
          set -- --backlog "${BACKLOG:-none}"
          if [ "$DRY_RUN" = 'true' ]; then set -- "$@" --dry-run; fi
          pnpm exec tsx scripts/tag-npm-releases.ts --repository "$GITHUB_REPOSITORY" "$@" | tee -a "$GITHUB_STEP_SUMMARY"
