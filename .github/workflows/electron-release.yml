name: Build Electron App

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (e.g., v0.1.0). Required if creating release.'
        type: string
        default: ''
      platforms:
        description: 'Platforms to build for'
        type: choice
        options:
          - mac
          - mac-windows-linux
        default: mac

  release:
    types: [created]

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build Electron app
        run: pnpm build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-mac
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.platforms == 'mac-windows-linux')
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build Electron app
        run: pnpm build:electron

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-windows
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.platforms == 'mac-windows-linux')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: 'file:./test.db'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0: native pnpm 12 support

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.8.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build Electron app
        run: pnpm build:electron

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-mac, build-windows, build-linux]
    if: |
      always() &&
      needs.build-mac.result == 'success' &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Upload to Release (from release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/**/*

      - name: Create new Release (from workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          draft: true
          files: artifacts/**/*

  # Simpler job for mac-only builds without release
  upload-mac-only:
    name: Summary (Mac Only)
    needs: [build-mac]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.platforms == 'mac' &&
      github.event.inputs.create_release != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Build complete
        run: echo "macOS build complete. Download artifacts from the workflow run."
