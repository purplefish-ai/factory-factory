# A separate, minimal installation for the serial coverage gate.
pmOnFail: ignore
# Keep this independent install under the root dependency intake policy.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# This toolchain has no dependency that needs an approved lifecycle build.
allowBuilds: {}
