appId: com.factoryfactory.app
productName: Factory Factory
# The npm package entry remains the CLI; desktop packages launch Electron main.
extraMetadata:
  main: electron/dist/electron/main/index.js
directories:
  output: release
  buildResources: build-resources
files:
  # Compiled backend (runs in Electron main process)
  - dist/src/backend/**/*
  # Markdown prompts resolved relative to the compiled backend
  - dist/prompts/**/*
  # Shared runtime imports used by the backend
  - dist/src/shared/**/*
  - dist/src/lib/**/*
  # Compiled Electron main process
  - electron/dist/**/*
  # Frontend build
  - dist/client/**/*
  # Package manifest (required)
  - package.json
  # Native modules that cannot be bundled - include with pnpm structure
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/node-addon-api/**/*
  - node_modules/node-pty/**/*
  # Prisma generated client (compiled JS files)
  - dist/prisma/generated/**/*
  - node_modules/@prisma/**/*
  - node_modules/.prisma/**/*
  # pnpm store entries for Prisma (resolved symlinks)
  - node_modules/.pnpm/@prisma+client@*/**/*
  - node_modules/.pnpm/@prisma+client-runtime-utils@*/**/*
  - node_modules/.pnpm/@prisma+adapter-better-sqlite3@*/**/*
  - node_modules/.pnpm/.prisma+client@*/**/*
  # pnpm store entries for native modules
  - node_modules/.pnpm/better-sqlite3@*/**/*
  - node_modules/.pnpm/node-pty@*/**/*
  - node_modules/.pnpm/bindings@*/**/*
  - node_modules/.pnpm/file-uri-to-path@*/**/*
  - node_modules/.pnpm/node-addon-api@*/**/*
  # ACP adapters and their packaged Codex/Claude runtimes.
  - node_modules/@agentclientprotocol/**/*
  - node_modules/.pnpm/@agentclientprotocol+*/**/*
  - node_modules/.pnpm/@openai+codex*/**/*
  - node_modules/.pnpm/@anthropic-ai+claude-agent-sdk*/**/*
  # Exclude dev/build dependencies
  - '!**/node_modules/.pnpm/*storybook*/**'
  - '!**/node_modules/.pnpm/*vite*/**'
  - '!**/node_modules/.pnpm/*vitest*/**'
  - '!**/node_modules/.pnpm/*typescript*/**'
  - '!**/node_modules/.pnpm/*biome*/**'
  - '!**/node_modules/.pnpm/*esbuild*/**'
  - '!**/node_modules/.pnpm/*tailwindcss*/**'
  - '!**/node_modules/.pnpm/*postcss*/**'
  - '!**/node_modules/.pnpm/*next*/**'
extraResources:
  - from: prisma/migrations
    to: prisma/migrations
  - from: prisma/schema.prisma
    to: prisma/schema.prisma
asar: true
asarUnpack:
  # ACP subprocesses run as Node outside ASAR and need their full dependency tree,
  # including pure-JS packages such as diff and zod. Keep runtime resolution intact.
  - node_modules/**/*
  - dist/prisma/generated/**/*
  # Compiled backend (runs in Electron main process)
  - dist/src/backend/**/*
  # Markdown prompts resolved relative to the compiled backend
  - dist/prompts/**/*
  # Shared runtime imports used by the backend
  - dist/src/shared/**/*
  - dist/src/lib/**/*
  # Frontend must be unpacked for Express static serving
  - dist/client/**/*
mac:
  minimumSystemVersion: '13.0'
  category: public.app-category.developer-tools
  target: [dmg, zip]
win:
  target: [nsis]
linux:
  target: [AppImage, deb]
npmRebuild: true
